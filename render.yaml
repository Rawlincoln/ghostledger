# GhostLedger on Render. One-click: https://render.com/deploy?repo=https://github.com/Rawlincoln/ghostledger
services:
  - type: web
    name: ghostledger
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: render-com
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: VITE_AUTH_ENABLED
        value: "false"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
