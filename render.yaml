# GhostLedger on Render's free instance (512MB).
# PGLite needs ~490MB by itself, so this host serves the public record from memory.
# Citizen reports last until the free instance sleeps.
services:
  - type: web
    name: ghostledger
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 NPM_CONFIG_PRODUCTION=false npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /healthz.txt
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: render-com
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: VITE_AUTH_ENABLED
        value: "false"
      - key: GHOST_EMBEDDED_DB
        value: "off"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
