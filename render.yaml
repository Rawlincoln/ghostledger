# GhostLedger on Render.
# Free (512MB) is killed on boot: the embedded database peaks near 760MB.
# 1c-2g is the smallest plan that stays up. Dashboard shows the price before you confirm.
services:
  - type: web
    name: ghostledger
    runtime: node
    plan: 1c-2g
    region: frankfurt
    branch: main
    buildCommand: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 NPM_CONFIG_PRODUCTION=false npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /healthz.txt
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: render-com
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: VITE_AUTH_ENABLED
        value: "false"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
